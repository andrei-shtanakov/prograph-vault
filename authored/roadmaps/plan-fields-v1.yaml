  - id: PF-3
    title: "Offline plan-fields package (dispatcher/packages/plan-fields)"
    phase: "3"
    owner_project: dispatcher
    target_contract: plan-fields-v1
    depends_on: [PF-2A]       # PF-2A carries PF-1 transitively; the package implements
                              # PF-2A's identity checks, so it needs those settled first
    expected_evidence:
      - "SHIPPED + MERGED (dispatcher#72): packages/plan-fields — standalone `plan-fields`
        0.1.0 with parser API, canonical JSON node/edge/diagnostics model, CLI, vendored
        pinned contract, offline tests, and no import of dispatcher app code"
      - "VERIFICATION now real but kept in prose (no machine rule for `CI green`, to avoid a
        false `verified`): `plan-fields conformance` reproduces all 7 vendored PF-1 fixtures,
        and the package's own tests/ruff/pyrefly run in the dispatcher `plan-fields` CI job"
