      - rule: file_exists
        kind: implementation
        project: dispatcher
        path: packages/plan-fields/pyproject.toml
      - rule: file_exists
        kind: implementation
        project: dispatcher
        path: packages/plan-fields/src/plan_fields/parser.py
      - rule: file_exists
        kind: implementation
        project: dispatcher
